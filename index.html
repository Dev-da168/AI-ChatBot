<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Dental Clinic Assistant</title>


<style>

/* ============================================================
   GLOBAL
============================================================ */

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


body {

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #eaf6ff,
            #ffffff
        );

    display: flex;

    justify-content: center;

    align-items: center;

}


/* ============================================================
   WELCOME SCREEN
============================================================ */

.welcome-screen {

    width: 100%;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

}


.welcome-card {

    width: 480px;

    background: white;

    padding: 50px 40px;

    border-radius: 25px;

    text-align: center;

    box-shadow:
        0 15px 50px
        rgba(0, 0, 0, 0.10);

}


.clinic-icon {

    width: 100px;

    height: 100px;

    margin: 0 auto 25px;

    background: #2563eb;

    color: white;

    border-radius: 50%;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 50px;

}


.welcome-card h1 {

    font-size: 30px;

    color: #1e293b;

    margin-bottom: 10px;

}


.welcome-card h2 {

    color: #2563eb;

    font-size: 18px;

    margin-bottom: 15px;

}


.welcome-card p {

    color: #64748b;

    line-height: 1.6;

    margin-bottom: 25px;

}

.start-button {

    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 12px;

    background: #2563eb;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;

}


.start-button:hover {

    background: #1d4ed8;

    transform: translateY(-1px);

}
.language-selector {

    display: flex;

    justify-content: flex-end;

    gap: 6px;

    margin-bottom: 18px;

}

.language-button {

    width: 32px;

    height: 28px;

    padding: 2px;

    flex: 0 0 32px;

    border: 1px solid #cbd5e1;

    border-radius: 10px;

    background: white;

    color: #334155;

    cursor: pointer;

}

.language-button.active {

    border-color: #2563eb;

    background: #eff6ff;

    color: #1d4ed8;

    font-weight: bold;

}


/* ============================================================
   CHAT SCREEN
============================================================ */

.chat-screen {

    display: none;

    width: 100%;

    height: 100vh;

    justify-content: center;

    align-items: center;

}


.chat-container {

    width: 470px;

    height: 750px;

    max-height: 100vh;

    background: white;

    border-radius: 20px;

    overflow: hidden;

    box-shadow:
        0 10px 40px
        rgba(0, 0, 0, 0.12);

    display: flex;

    flex-direction: column;

}


/* ============================================================
   HEADER
============================================================ */

.chat-header {

    background: #2563eb;

    color: white;

    padding: 18px 20px;

    display: flex;

    align-items: center;

    gap: 12px;

}


.back-button {

    border: none;

    background: transparent;

    color: white;

    font-size: 22px;

    cursor: pointer;

}


.chat-icon {

    width: 45px;

    height: 45px;

    background: white;

    color: #2563eb;

    border-radius: 50%;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 23px;

}


.header-info {

    flex: 1;

}


.header-info h2 {

    font-size: 17px;

    margin-bottom: 4px;

}


.header-info p {

    font-size: 11px;

}


.online-dot {

    display: inline-block;

    width: 7px;

    height: 7px;

    background: #22c55e;

    border-radius: 50%;

    margin-right: 4px;

}


/* ============================================================
   CHAT BOX
============================================================ */

.chat-box {

    flex: 1;

    padding: 20px;

    overflow-y: auto;

    background: #f8fafc;

}


.message {

    display: flex;

    margin-bottom: 18px;

}


.bot-message {

    justify-content: flex-start;

}


.user-message {

    justify-content: flex-end;

}


.message-wrapper {

    max-width: 86%;

}


.message-content {

    padding: 12px 15px;

    border-radius: 16px;

    line-height: 1.5;

    font-size: 14px;

    white-space: pre-wrap;

}


.bot-message
.message-content {

    background: #e7eef8;

    color: #1e293b;

    border-bottom-left-radius: 4px;

}


.user-message
.message-content {

    background: #2563eb;

    color: white;

    border-bottom-right-radius: 4px;

}


/* ============================================================
   OPTIONS
============================================================ */

.option-container {

    display: flex;

    flex-direction: column;

    gap: 8px;

    margin-top: 10px;

}


.option-button {

    width: 100%;

    padding: 11px 14px;

    background: white;

    color: #2563eb;

    border: 1px solid #2563eb;

    border-radius: 10px;

    text-align: left;

    cursor: pointer;

    font-size: 13px;

    transition: 0.2s;

}


.option-button:hover {

    background: #2563eb;

    color: white;

}


.option-button:disabled {

    opacity: 0.45;

    cursor: not-allowed;

}


/* ============================================================
   APPOINTMENT CARD
============================================================ */

.appointment-card {

    width: 100%;

    background: white;

    padding: 16px;

    border-radius: 15px;

    margin-top: 10px;

    border: 1px solid #e2e8f0;

}


.appointment-card h3 {

    color: #1e293b;

    margin-bottom: 15px;

    font-size: 16px;

}

.service-choice {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 10px 0;

    color: #334155;

    font-size: 14px;

}

.service-choice input {

    width: 17px;

    height: 17px;

    accent-color: #2563eb;

}

.product-shop {

    width: 100%;

    margin-top: 10px;

}

.product-catalog {

    display: grid;

    gap: 12px;

}

.product-item,
.product-cart,
.delivery-checkout {

    background: white;

    border: 1px solid #e2e8f0;

    border-radius: 15px;

    padding: 14px;

}

.product-item {

    display: grid;

    grid-template-columns: 76px 1fr;

    gap: 12px;

    align-items: center;

}

.product-image {

    width: 76px;

    height: 76px;

    object-fit: cover;

    border-radius: 12px;

    background: #eff6ff;

}

.product-info h3,
.product-cart h3,
.delivery-checkout h3 {

    margin: 0 0 6px;

    color: #1e293b;

    font-size: 14px;

}

.product-price {

    color: #2563eb;

    font-size: 14px;

    font-weight: bold;

}

.product-item-actions {

    grid-column: 1 / -1;

    display: flex;

    align-items: center;

    gap: 10px;

}

.product-quantity {

    width: 64px;

    padding: 9px;

    border: 1px solid #cbd5e1;

    border-radius: 9px;

}

.product-add-button,
.cart-action-button {

    border: 1px solid #2563eb;

    border-radius: 9px;

    background: white;

    color: #2563eb;

    cursor: pointer;

}

.product-add-button {

    flex: 1;

    padding: 10px;

    font-weight: bold;

}

.product-cart {

    margin-top: 12px;

}

.cart-row {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 8px;

    padding: 8px 0;

    color: #334155;

    font-size: 13px;

}

.cart-controls {

    display: flex;

    align-items: center;

    gap: 6px;

}

.cart-action-button {

    min-width: 30px;

    min-height: 30px;

}

.cart-total {

    margin-top: 8px;

    padding-top: 10px;

    border-top: 1px solid #e2e8f0;

    color: #1e293b;

    font-weight: bold;

}

.delivery-checkout {

    margin-top: 12px;

}

.order-confirmation {

    margin-top: 12px;

    padding: 14px;

    border: 1px solid #bbf7d0;

    border-radius: 15px;

    background: #f0fdf4;

    color: #166534;

}

.delivery-checkout label {

    display: block;

    margin-top: 12px;

    color: #334155;

    font-size: 13px;

}

.delivery-checkout input,
.delivery-checkout select,
.delivery-checkout textarea {

    width: 100%;

    margin-top: 6px;

    padding: 11px;

    border: 1px solid #cbd5e1;

    border-radius: 9px;

    font: inherit;

}

.delivery-checkout textarea {

    min-height: 76px;

    resize: vertical;

}

.order-feedback {

    margin-top: 10px;

    color: #dc2626;

    font-size: 13px;

}


/* DATE */

.date-input {

    width: 100%;

    padding: 12px;

    border: 1px solid #cbd5e1;

    border-radius: 10px;

    font-size: 14px;

    cursor: pointer;

}


.date-input:focus {

    outline: none;

    border-color: #2563eb;

}


.date-message {

    margin-top: 8px;

    color: #dc2626;

    font-size: 12px;

}


/* ============================================================
   TIME
============================================================ */

.time-title {

    margin-top: 18px;

    margin-bottom: 10px;

    font-size: 13px;

    font-weight: bold;

    color: #475569;

}


.time-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap: 8px;

}


.time-button {

    padding: 10px 5px;

    background: white;

    border: 1px solid #cbd5e1;

    border-radius: 9px;

    cursor: pointer;

    color: #334155;

    font-size: 12px;

}


.time-button:hover {

    border-color: #2563eb;

    color: #2563eb;

}


.time-button.selected {

    background: #2563eb;

    color: white;

    border-color: #2563eb;

}


.time-button.unavailable {

    background: #f1f5f9;

    color: #94a3b8;

    border-color: #e2e8f0;

    cursor: not-allowed;

    text-decoration: line-through;

}


/* ============================================================
   CONTINUE
============================================================ */

.continue-button {

    width: 100%;

    padding: 12px;

    margin-top: 15px;

    border: none;

    border-radius: 10px;

    background: #2563eb;

    color: white;

    font-weight: bold;

    cursor: pointer;

}


.continue-button:disabled {

    background: #cbd5e1;

    cursor: not-allowed;

}


/* ============================================================
   PATIENT FORM
============================================================ */

.patient-form {

    margin-top: 10px;

    background: white;

    padding: 16px;

    border-radius: 15px;

    border: 1px solid #e2e8f0;

}


.patient-form h3 {

    margin-bottom: 12px;

    color: #1e293b;

}


.patient-form label {

    display: block;

    margin-top: 10px;

    margin-bottom: 5px;

    font-size: 13px;

    color: #475569;

}


.patient-form input {

    width: 100%;

    padding: 11px;

    border: 1px solid #cbd5e1;

    border-radius: 9px;

    outline: none;

}


.patient-form input:focus {

    border-color: #2563eb;

}


/* ============================================================
   CONFIRM CARD
============================================================ */

.confirm-card {

    background: white;

    padding: 16px;

    border-radius: 15px;

    border: 1px solid #e2e8f0;

    margin-top: 10px;

}


.confirm-card h3 {

    margin-bottom: 12px;

    color: #1e293b;

}


.confirm-row {

    display: flex;

    justify-content: space-between;

    gap: 15px;

    padding: 9px 0;

    border-bottom: 1px solid #f1f5f9;

    font-size: 13px;

}


.confirm-label {

    color: #64748b;

}


.confirm-value {

    color: #1e293b;

    font-weight: bold;

    text-align: right;

}


.confirm-button {

    width: 100%;

    padding: 12px;

    margin-top: 15px;

    border: none;

    border-radius: 10px;

    background: #16a34a;

    color: white;

    font-weight: bold;

    cursor: pointer;

}


/* ============================================================
   SUCCESS
============================================================ */

.success-card {

    background: #f0fdf4;

    border: 1px solid #86efac;

    padding: 16px;

    border-radius: 15px;

    margin-top: 10px;

}


.success-card h3 {

    color: #15803d;

    margin-bottom: 10px;

}


.success-card p {

    color: #166534;

    font-size: 13px;

    line-height: 1.6;

}


/* ============================================================
   INPUT AREA
============================================================ */

.input-area {

    display: flex;

    gap: 10px;

    padding: 15px;

    background: white;

    border-top: 1px solid #e5e7eb;

}


.input-area input {

    flex: 1;

    border: 1px solid #d1d5db;

    border-radius: 25px;

    padding: 12px 16px;

    outline: none;

    font-size: 14px;

}


.input-area input:focus {

    border-color: #2563eb;

}


.send-button {

    width: 45px;

    height: 45px;

    border: none;

    border-radius: 50%;

    background: #2563eb;

    color: white;

    font-size: 18px;

    cursor: pointer;

}


.send-button:disabled {

    background: #94a3b8;

}


/* ============================================================
   TYPING
============================================================ */

.typing {

    display: flex;

    gap: 4px;

}


.typing span {

    width: 7px;

    height: 7px;

    background: #64748b;

    border-radius: 50%;

    animation: typing 1.2s infinite;

}


.typing span:nth-child(2) {

    animation-delay: 0.2s;

}


.typing span:nth-child(3) {

    animation-delay: 0.4s;

}


@keyframes typing {

    0%,
    60%,
    100% {

        transform:
            translateY(0);

    }

    30% {

        transform:
            translateY(-5px);

    }

}


/* ============================================================
   MOBILE
============================================================ */

@media (max-width: 500px) {

    .welcome-card {

        width: 90%;

        padding: 40px 25px;

    }


    .chat-container {

        width: 100%;

        height: 100vh;

        border-radius: 0;

    }


    .time-grid {

        grid-template-columns:
            1fr 1fr;

    }

}

</style>

</head>

<!-- ============================================================
     WELCOME SCREEN
============================================================ -->

<div

    id="welcomeScreen"

        <div

            Customer Service Assistant
        </h2>

        </p>

        <button
            class="start-button"

            Start Chat

        </button>


    </div>

</div>


<!-- ============================================================

<div

            </div>


        </div>


        <!-- CHAT -->

        </div>


        <!-- INPUT -->

            <input
                type="text"
                id="messageInput"
                data-i18n-placeholder="messagePlaceholder"
                placeholder="Ask about your teeth..."
                autocomplete="off"
            >


            <button
                class="send-button"
                id="sendButton"
                onclick="sendMessage()"
            >

                ➤

            </button>


        </div>


    </div>

</div>

function text(key) {

    return translations[currentLanguage][key];

}

function mainMenuOptions() {

    return [
        text("appointmentOption"),
        text("serviceOption"),
        text("productsOption"),
        text("priceOption"),
        text("hoursOption"),
        text("contactOption")
    ];

}

function serviceLabel(service) {

    const item = dentalServices.find(
        function(candidate) {

            return candidate.english === service;

        }
    );

    return item
        ? text(item.key)
        : service;

}

function serviceLabels(services) {

    return services
        .map(serviceLabel)
        .join(", ");

}

function formatAppointmentDate(date) {

    if (currentLanguage !== "km") {

        return date.toLocaleDateString(
            "en-US",
            {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            }
        );

    }

    const weekdays = [
        "អាទិត្យ",
        "ចន្ទ",
        "អង្គារ",
        "ពុធ",
        "ព្រហស្បតិ៍",
        "សុក្រ",
        "សៅរ៍"
    ];
    const months = [
        "មករា",
        "កុម្ភៈ",
        "មីនា",
        "មេសា",
        "ឧសភា",
        "មិថុនា",
        "កក្កដា",
        "សីហា",
        "កញ្ញា",
        "តុលា",
        "វិច្ឆិកា",
        "ធ្នូ"
    ];
    const khmerDigits = "០១២៣៤៥៦៧៨៩";
    const toKhmerDigits = function(value) {

        return String(value).replace(
            /\d/g,
            function(digit) {

                return khmerDigits[Number(digit)];

            }
        );

    };

    return "ថ្ងៃ" + weekdays[date.getDay()]
        + " ទី" + toKhmerDigits(date.getDate())
        + " ខែ" + months[date.getMonth()]
        + " ឆ្នាំ" + toKhmerDigits(date.getFullYear());

}

function setLanguage(language) {

    currentLanguage = language === "km" ? "km" : "en";
    document.documentElement.lang =
        currentLanguage === "km" ? "km" : "en";

    document.getElementById("englishLanguage").classList.toggle(
        "active",
        currentLanguage === "en"
    );
    document.getElementById("englishLanguage").setAttribute(
        "aria-pressed",
        String(currentLanguage === "en")
    );
    document.getElementById("khmerLanguage").classList.toggle(
        "active",
        currentLanguage === "km"
    );
    document.getElementById("khmerLanguage").setAttribute(
        "aria-pressed",
        String(currentLanguage === "km")
    );

    document.getElementById("welcomeTitle").textContent = text("title");
    document.getElementById("welcomeSubtitle").textContent = text("subtitle");
    document.getElementById("welcomeDescription").textContent = text("welcomeDescription");
    const appointmentsFeature = document.getElementById("appointmentsFeature");
    const servicesFeature = document.getElementById("servicesFeature");

    if (appointmentsFeature) {
        appointmentsFeature.textContent = text("appointmentsFeature");
    }

    if (servicesFeature) {
        servicesFeature.textContent = text("servicesFeature");
    }

    document.querySelector(".start-button").textContent = text("startChat");
    document.getElementById("chatTitle").textContent = text("chatTitle");
    document.getElementById("onlineText").textContent = text("online");
    messageInput.placeholder = text("messagePlaceholder");

}

/* ============================================================
   SEND MESSAGE
============================================================ */

async function sendMessage(
    selectedMessage = null
) {

    const message =
        selectedMessage ||
        messageInput.value.trim();

    if (!message) {

        return;

    }

    addMessage(
        message,
        "user"
    );

    messageInput.value = "";

    /*
     * APPOINTMENT START
     */

    if (
        /make(?: an)? appointment/i.test(message)
        || (
            currentLanguage === "km"
            && message.includes("ណាត់ជួប")
        )
    ) {

        if (appointment.services.length > 0) {

            appointmentMode = true;
            showCalendar();
            return;

        }

        appointmentMode = true;

        addMessage(
            text("beginAppointment"),
            "bot"
        );
        showServiceSelection();

        return;

    }

    if (
        message.includes(text("productsOption"))
        || /\b(shop|products|buy|order|toothpaste|toothbrush|oral rinse|mouthwash)\b/i.test(message)
        || (
            currentLanguage === "km"
            && (
                message.includes("ថ្នាំដុសធ្មេញ")
                || message.includes("ច្រាសដុសធ្មេញ")
                || message.includes("ទឹកខ្ពុរមាត់")
                || message.includes("ផលិតផល")
            )
        )
    ) {

        showProductShop();
        return;

    }

    if (
        message.includes(text("priceOption"))
        || /\b(price information|prices?|pricing|costs?|fees?)\b/i.test(message)
        || (
            currentLanguage === "km"
            && (message.includes("តម្លៃ") || message.includes("ថ្លៃ"))
        )
    ) {

        showServiceSelection("prices");
        return;

    }

    if (
        message.includes(text("serviceOption"))
        || /\b(dental services|other services)\b/i.test(message)
        || (
            currentLanguage === "km"
            && (
                message.includes("សេវាកម្មទន្តសាស្ត្រ")
                || message.includes("សេវាកម្មផ្សេងទៀត")
            )
        )
    ) {

        showServiceSelection("information");
        return;

    }

    if (
        currentLanguage === "km"
        && (
            (message.includes("ម៉ោង") && message.includes("បើក"))
            || /\b(opening hours|business hours|when.*open)\b/i.test(message)
        )
    ) {

        addMessage(
            text("openingHoursTitle") + "\n\n"
            + text("openingDays") + "\n"
            + text("openingTime") + "\n\n"
            + text("sundayClosedLabel"),
            "bot",
            [text("mainMenu")]
        );

        return;

    }

    if (
        currentLanguage === "km"
        && (
            message.includes("ទាក់ទង")
            || message.includes("លេខទូរស័ព្ទ")
            || /\b(contact|phone|telephone|email)\b/i.test(message)
        )
    ) {

        addMessage(
            text("contactTitle") + "\n\n"
            + text("phoneLabel") + "+855 12 345 678\n"
            + text("emailLabel") + "dentalclinic@gmail.com",
            "bot",
            [text("mainMenu")]
        );

        return;

    }

    if (
        currentLanguage === "km"
        && message.includes("ម៉ឺនុយដើម")
    ) {

        addMessage(
            text("greeting"),
            "bot",
            mainMenuOptions()
        );

        return;

    }

    /*
     * SERVICE SELECTED
     */

    const serviceItem =
        dentalServices.find(
            function(service) {

                return message.toLowerCase().includes(
                    service.english.toLowerCase()
                ) || message.includes(
                    text(service.key)
                );

            }
        );

    if (serviceItem) {

        appointment.services = [serviceItem.english];
        appointment.date = "";
        appointment.time = "";

        if (appointmentMode) {

            showCalendar();

        } else {

            showServiceInformation([serviceItem.english]);

        }

        return;

    }

    
    /*
     * NORMAL CHATBOT
     */

    sendButton.disabled = true;

    const typingId = showTyping();

    try {

        const response = await fetch(
            "/chat",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message
                })
            }
        );

        if (!response.ok) {

            throw new Error("Server error");

        }

        const data = await response.json();

        removeTyping(typingId);

        addMessage(
            data.response,
            "bot",
            data.options || []
        );

    } catch (error) {

        console.error(error);
        removeTyping(typingId);

        addMessage(
            "Sorry, I couldn't connect to the server. "
            + "Please try again.",
            "bot"
        );

    } finally {

        sendButton.disabled = false;
        messageInput.focus();

    }

}

function formatProductPrice(priceCents) {

    return "$" + (priceCents / 100).toFixed(2) + " USD";

}

function showProductShop() {

    addMessage(text("shopPrompt"), "bot");

    const shopCard = document.createElement("div");
    shopCard.className = "product-shop";
    shopCard.innerHTML = `
        <div class="product-catalog">
            ${products.map(function(product) {
                return `
                    <article class="product-item">
                        <img
                            class="product-image"
                            src="${product.image}"
                            alt="${escapeHtml(text(product.nameKey))}"
                        >
                        <div class="product-info">
                            <h3>${escapeHtml(text(product.nameKey))}</h3>
                            <span class="product-price">${formatProductPrice(product.priceCents)}</span>
                        </div>
                        <div class="product-item-actions">
                            <label>
                                ${text("quantity")}
                                <input
                                    class="product-quantity"
                                    type="number"
                                    min="1"
                                    max="99"
                                    value="1"
                                    aria-label="${escapeHtml(text("quantity"))}"
                                >
                            </label>
                            <button
                                class="product-add-button"
                                type="button"
                                data-product-id="${product.id}"
                            >${text("addToCart")}</button>
                        </div>
                    </article>
                `;
            }).join("")}
        </div>
        <section class="product-cart">
            <h3>${text("shoppingCart")}</h3>
            <div class="cart-content"></div>
        </section>
    `;

    shopCard.querySelectorAll(".product-add-button").forEach(function(button) {
        button.addEventListener("click", function() {
            const quantityInput = button.closest(".product-item")
                .querySelector(".product-quantity");
            const quantity = Number(quantityInput.value);

            if (!Number.isInteger(quantity) || quantity < 1 || quantity > 99) {
                quantityInput.reportValidity();
                return;
            }

            const productId = button.dataset.productId;
            productCart[productId] = (productCart[productId] || 0) + quantity;
            quantityInput.value = "1";
            updateProductCart(shopCard);
        });

        updateDeliveryOrderSummary(shopCard);

    });

    shopCard.querySelector(".product-cart").addEventListener("click", function(event) {
        const button = event.target.closest("[data-cart-action]");

        if (!button) {
            return;
        }

        const productId = button.dataset.productId;
        const action = button.dataset.cartAction;

        if (action === "remove") {
            delete productCart[productId];
        } else {
            const nextQuantity = productCart[productId]
                + (action === "increase" ? 1 : -1);

            if (nextQuantity < 1) {
                delete productCart[productId];
            } else {
                productCart[productId] = nextQuantity;
            }
        }

        updateProductCart(shopCard);
    });

    chatBox.appendChild(shopCard);
    updateProductCart(shopCard);
    scrollToBottom();

}

function productCartTotal() {

    return products.reduce(function(total, product) {
        return total + product.priceCents * (productCart[product.id] || 0);
    }, 0);

}

function updateProductCart(shopCard) {

    const cartContent = shopCard.querySelector(".cart-content");
    const cartProducts = products.filter(function(product) {
        return productCart[product.id] > 0;
    });

    if (cartProducts.length === 0) {
        cartContent.innerHTML = `<p>${text("cartEmpty")}</p>`;
        const checkout = shopCard.querySelector(".delivery-checkout");

        if (checkout) {
            checkout.remove();
        }

        return;
    }

    cartContent.innerHTML = `
        ${cartProducts.map(function(product) {
            return `
                <div class="cart-row">
                    <span>${escapeHtml(text(product.nameKey))} × ${productCart[product.id]}</span>
                    <div class="cart-controls">
                        <button
                            class="cart-action-button"
                            type="button"
                            data-cart-action="decrease"
                            data-product-id="${product.id}"
                            aria-label="${escapeHtml(text("quantity"))} −"
                        >−</button>
                        <button
                            class="cart-action-button"
                            type="button"
                            data-cart-action="increase"
                            data-product-id="${product.id}"
                            aria-label="${escapeHtml(text("quantity"))} +"
                        >+</button>
                        <button
                            class="cart-action-button"
                            type="button"
                            data-cart-action="remove"
                            data-product-id="${product.id}"
                            aria-label="${escapeHtml(text("removeItem"))}"
                        >×</button>
                    </div>
                </div>
            `;
        }).join("")}
        <div class="cart-total">${text("orderTotal")}${formatProductPrice(productCartTotal())}</div>
        <button class="continue-button checkout-button" type="button">
            ${text("checkout")}
        </button>
    `;

    cartContent.querySelector(".checkout-button").addEventListener("click", function() {
        showDeliveryCheckout(shopCard);
    });

}

function showDeliveryCheckout(shopCard) {

    const existingCheckout = shopCard.querySelector(".delivery-checkout");

    if (existingCheckout) {
        existingCheckout.scrollIntoView({ behavior: "smooth", block: "nearest" });
        return;
    }

    const today = new Date();
    const minDate = [
        today.getFullYear(),
        String(today.getMonth() + 1).padStart(2, "0"),
        String(today.getDate()).padStart(2, "0")
    ].join("-");
    const checkout = document.createElement("section");
    checkout.className = "delivery-checkout";
    checkout.innerHTML = `
        <h3>${text("deliveryDetails")}</h3>
        <div class="delivery-order-summary"></div>
        <form class="delivery-form">
            <label>
                ${text("deliveryDate")}
                <input type="date" name="date" min="${minDate}" required>
            </label>
            <label>
                ${text("deliveryTime")}
                <select name="time" required>
                    <option value="">${text("selectDeliveryTime")}</option>
                    ${deliveryTimes.map(function(time) {
                        return `<option value="${time}">${time}</option>`;
                    }).join("")}
                </select>
            </label>
            <label>
                ${text("customerName")}
                <input type="text" name="name" maxlength="120" required>
            </label>
            <label>
                ${text("customerPhone")}
                <input type="tel" name="phone" maxlength="40" required>
            </label>
            <label>
                ${text("deliveryAddress")}
                <textarea name="address" maxlength="500" placeholder="${text("addressPlaceholder")}" required></textarea>
            </label>
            <p class="order-feedback" role="alert"></p>
            <button class="continue-button" type="submit">${text("placeOrder")}</button>
        </form>
    `;

    shopCard.appendChild(checkout);
    updateDeliveryOrderSummary(shopCard);

    const dateInput = checkout.querySelector('input[name="date"]');
    dateInput.addEventListener("change", function() {
        const selectedDate = new Date(dateInput.value + "T00:00:00");

        if (dateInput.value && selectedDate.getDay() === 0) {
            dateInput.setCustomValidity(text("sundayDelivery"));
        } else {
            dateInput.setCustomValidity("");
        }
    });

    checkout.querySelector(".delivery-form").addEventListener("submit", async function(event) {
        event.preventDefault();

        if (!this.reportValidity()) {
            return;
        }

        const submitButton = this.querySelector('button[type="submit"]');
        const feedback = checkout.querySelector(".order-feedback");
        const formData = new FormData(this);
        submitButton.disabled = true;
        feedback.textContent = "";

        try {
            const response = await fetch("/orders", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    items: products.filter(function(product) {
                        return productCart[product.id] > 0;
                    }).map(function(product) {
                        return {
                            product_id: product.id,
                            quantity: productCart[product.id]
                        };
                    }),
                    date: formData.get("date"),
                    time: formData.get("time"),
                    name: formData.get("name"),
                    phone: formData.get("phone"),
                    address: formData.get("address")
                })
            });
            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.detail || text("orderError"));
            }

            const order = data.order;
            checkout.className = "order-confirmation";
            checkout.innerHTML = `
                <h3>${text("orderSuccess")}${escapeHtml(order.id)}</h3>
                <p>${text("orderTotal")}${formatProductPrice(order.total_cents)}</p>
                <p>${escapeHtml(order.date)} · ${escapeHtml(order.time)}</p>
            `;
            productCart = {};
            updateProductCart(shopCard);
            scrollToBottom();
        } catch (error) {
            console.error(error);
            feedback.textContent = text("orderError");
            submitButton.disabled = false;
        }
    });

    scrollToBottom();

}

function updateDeliveryOrderSummary(shopCard) {

    const summary = shopCard.querySelector(".delivery-order-summary");

    if (!summary) {
        return;
    }

    summary.textContent = products.filter(function(product) {
        return productCart[product.id] > 0;
    }).map(function(product) {
        return text(product.nameKey)
            + " × " + productCart[product.id];
    }).join(", ");

}

/* ============================================================
   LOAD AVAILABLE TIMES
============================================================ */

async function loadAvailableTimes(
    selectedDate
) {


    if (!selectedDate) {

        return;

    }


    const date =
        new Date(
            selectedDate
            + "T00:00:00"
        );


    /*
     * Sunday
     */

    if (
        date.getDay() === 0
    ) {

        document.getElementById(
            "dateMessage"
        ).textContent =
            text("sundayClosed");

        document.getElementById(
            "timeSection"
        ).style.display =
            "none";

        appointment.date =
            "";

        return;

    }


    appointment.date =
        selectedDate;


    appointment.time =
        "";


    document.getElementById(
        "dateMessage"
    ).textContent =
        "";


    try {

        const response =
            await fetch(
                "/appointment/times?selected_date="
                + encodeURIComponent(
                    selectedDate
                )
            );


        const data =
            await response.json();


        if (
            !data.available
        ) {

            document.getElementById(
                "dateMessage"
            ).textContent =
                currentLanguage === "km"
                    ? text("invalidDate")
                    : data.message;

            return;

        }


        const timeGrid =
            document.getElementById(
                "timeGrid"
            );


        timeGrid.innerHTML =
            "";


        data.times.forEach(
            function(time) {

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "time-button";


                button.textContent =
                    time;


                button.type =
                    "button";


                button.onclick =
                    function() {

                        selectTime(
                            button,
                            time
                        );

                    };


                timeGrid.appendChild(
                    button
                );

            }
        );


        if (
            data.times.length === 0
        ) {

            timeGrid.innerHTML = `

                <p
                    style="
                        grid-column:1/-1;
                        color:#64748b;
                        font-size:13px;
                    "
                >
                    ${text("noTimes")}
                </p>

            `;

        }


        document.getElementById(
            "timeSection"
        ).style.display =
            "block";


        scrollToBottom();

    } catch (error) {

        console.error(
            error
        );

        document.getElementById(
            "dateMessage"
        ).textContent =
            text("unableTimes");

    }

}

        .onclick =
        function() {

            confirmAppointment();

        };


    scrollToBottom();

}


/* ============================================================
   CONFIRM APPOINTMENT
============================================================ */

async function confirmAppointment() {


    const button =
        document.getElementById(
            "confirmButton"
        );


    button.disabled =
        true;


    button.textContent =
        text("saving");


    try {

        const response =
            await fetch(
                "/appointment",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        services:
                            appointment.services,

                        date:
                            appointment.date,

                        time:
                            appointment.time,

                        name:
                            appointment.name,

                        phone:
                            appointment.phone

                    })

                }
            );


        const data =
            await response.json();


        if (
            !data.success
        ) {

            button.disabled =
                false;

            button.textContent =
                text("confirm");


            addMessage(
                "⚠️ "
                + (
                    currentLanguage === "km"
                        ? text("bookingRejected")
                        : data.message || text("bookingRejected")
                ),
                "bot"
            );


            return;

        }


        showAppointmentSuccess(
            data.appointment
        );


    } catch (error) {

        console.error(
            error
        );


        button.disabled =
            false;

        button.textContent =
            text("confirm");


        addMessage(
            text("saveError"),
            "bot"
        );

    }

}


/* ============================================================
   SUCCESS
============================================================ */

function showAppointmentSuccess(
    savedAppointment
) {


    const date =
        new Date(
            savedAppointment.date
            + "T00:00:00"
        );


    const formattedDate =
        formatAppointmentDate(date);


    addMessage(
        text("success"),
        "bot"
    );


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "success-card";


    card.innerHTML = `

        <h3>${text("confirmed")}</h3>


        <p>

            <strong>
                ${text("appointmentId")}
            </strong>

            ${escapeHtml(
                savedAppointment.id
            )}

            <br><br>


            <strong>
                ${text("service")}:
            </strong>

            ${escapeHtml(
            serviceLabels(
                savedAppointment.services || [savedAppointment.service]
            )
            )}

            <br>


            <strong>
                ${text("date")}:
            </strong>

            ${escapeHtml(
                formattedDate
            )}

            <br>


            <strong>
                ${text("time")}:
            </strong>

            ${escapeHtml(
                savedAppointment.time
            )}

            <br>


            <strong>
                ${text("patient")}:
            </strong>

            ${escapeHtml(
                savedAppointment.name
            )}

            <br>


            <strong>
                ${text("phone")}:
            </strong>

            ${escapeHtml(
                savedAppointment.phone
            )}

            <br><br>

            ${text("confirmationNote")}

        </p>

    `;


    chatBox.appendChild(
        card
    );


    addMessage(
        text("next"),
        "bot",
        [
            text("appointmentOption"),
            text("serviceOption"),
            text("mainMenu")
        ]
    );


    resetAppointment();


    scrollToBottom();

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value;


    return div.innerHTML;

}


/* ============================================================
   ADD MESSAGE
============================================================ */

function addMessage(
    message,
    sender,
    options = []
) {


    const messageDiv =
        document.createElement(
            "div"
        );


    messageDiv.className =
        "message "
        + sender
        + "-message";


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "message-wrapper";


    const content =
        document.createElement(
            "div"
        );


    content.className =
        "message-content";


    content.textContent =
        message;


    wrapper.appendChild(
        content
    );


    messageDiv.appendChild(
        wrapper
    );


    chatBox.appendChild(
        messageDiv
    );


    /*
     * OPTIONS
     */

    if (
        sender === "bot"
        &&
        options.length > 0
    ) {


        const optionContainer =
            document.createElement(
                "div"
            );


        optionContainer.className =
            "option-container";


        options.forEach(
            function(option) {


                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "option-button";


                button.type =
                    "button";


                button.textContent =
                    option;


                button.onclick =
                    function() {


                        /*
                         * Disable selected
                         * options
                         */

                        optionContainer
                            .querySelectorAll(
                                "button"
                            )
                            .forEach(
                                function(btn) {

                                    btn.disabled =
                                        true;

                                }
                            );


                        sendMessage(
                            option
                        );

                    };


                optionContainer.appendChild(
                    button
                );

            }
        );


        wrapper.appendChild(
            optionContainer
        );

    }


    scrollToBottom();

}


/* ============================================================
   TYPING
============================================================ */

function showTyping() {


    const id =
        "typing-"
        + Date.now();


    const messageDiv =
        document.createElement(
            "div"
        );


    messageDiv.className =
        "message bot-message";


    messageDiv.id =
        id;


    messageDiv.innerHTML = `

        <div class="message-wrapper">

            <div class="message-content">

                <div class="typing">

                    <span></span>

                    <span></span>

                    <span></span>

                </div>

            </div>

        </div>

    `;


    chatBox.appendChild(
        messageDiv
    );


    scrollToBottom();


    return id;

}


/* ============================================================
   REMOVE TYPING
============================================================ */

function removeTyping(
    id
) {


    const element =
        document.getElementById(
            id
        );


    if (element) {

        element.remove();

    }

}


/* ============================================================
   SCROLL
============================================================ */

function scrollToBottom() {

    chatBox.scrollTop =
        chatBox.scrollHeight;

}


/* ============================================================
   ENTER KEY
============================================================ */

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);

</script>
