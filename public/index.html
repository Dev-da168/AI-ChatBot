<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Dental Clinic Assistant</title>


<link rel="stylesheet" href="/css/style.css">

</head>


<body>


<!-- ============================================================
     WELCOME SCREEN
============================================================ -->

<div
    class="welcome-screen"
    id="welcomeScreen"
>

    <div class="welcome-card">
        <div
            class="language-selector"
            aria-label="Choose language"
        >

            <button
                class="language-button active"
                id="englishLanguage"
                type="button"
                onclick="setLanguage('en')"
                aria-pressed="true"
            >
                🇺🇸
            </button>

            <button
                class="language-button"
                id="khmerLanguage"
                type="button"
                onclick="setLanguage('km')"
                aria-pressed="false"
            >
                🇰🇭
            </button>

        </div>


        <div class="clinic-icon">
            🦷
        </div>


        <h1 id="welcomeTitle">
            Dental Clinic
        </h1>


        <h2 id="welcomeSubtitle">
            Customer Service Assistant
        </h2>


        <p id="welcomeDescription">
            Our virtual assistant can help you
            make appointments, learn about dental
            services, and get information about
            common dental concerns.
        </p>

        <button
            class="start-button"
            id="startClinicBtn"
            onclick="startChat()"
        >
            💬 Clinic Assistant
        </button>

        <button
            class="ask-ai-button"
            id="startAiBtn"
            onclick="startAiChat()"
        >
            🧠 Ask Dental AI
        </button>


    </div>

</div>


<!-- ============================================================
     AI DENTAL KNOWLEDGE SCREEN
============================================================ -->

<div
    class="chat-screen"
    id="aiChatScreen"
    style="display:none"
>

    <div class="chat-container">

        <!-- HEADER -->
        <div class="chat-header ai-chat-header">

            <button
                class="back-button"
                onclick="closeAiChat()"
            >
                ←
            </button>

            <div class="chat-icon">
                🧠
            </div>

            <div class="header-info">
                <h2>
                    <span id="aiTitle">Dental AI</span>
                    <span class="ai-badge">GEMINI</span>
                </h2>
                <p>
                    <span class="online-dot"></span>
                    <span id="aiSubtitle">Ask me anything dental</span>
                </p>
            </div>

        </div>

        <!-- CHAT -->
        <div
            class="chat-box"
            id="aiChatBox"
        >
        </div>

        <!-- INPUT -->
        <div class="input-area">

            <input
                type="text"
                id="aiMessageInput"
                placeholder="e.g. Why do my gums bleed?"
                autocomplete="off"
            >

            <button
                class="send-button"
                id="aiSendButton"
                onclick="sendAiMessage()"
                style="background: linear-gradient(135deg, #0ea5e9, #6366f1);"
            >
                ➤
            </button>

        </div>

    </div>

</div>


<!-- original chat screen -->
<div
    class="chat-screen"
    id="chatScreen"
>


    <div class="chat-container">


        <!-- HEADER -->

        <div class="chat-header">


            <button
                class="back-button"
                onclick="goBack()"
            >

                ←

            </button>


            <div class="chat-icon">

                🦷

            </div>


            <div class="header-info">

                <h2 id="chatTitle">
                    Dental Assistant
                </h2>


                <p id="onlineStatus">

                    <span
                        class="online-dot"
                    ></span>

                    <span id="onlineText">Online</span>

                </p>

            </div>


        </div>


        <!-- CHAT -->

        <div
            class="chat-box"
            id="chatBox"
        >
        </div>


        <!-- INPUT -->

        <div class="input-area">


            <input
                type="text"
                id="messageInput"
                data-i18n-placeholder="messagePlaceholder"
                placeholder="Ask about your teeth..."
                autocomplete="off"
            >


            <button
                class="send-button"
                id="sendButton"
                onclick="sendMessage()"
            >

                ➤

            </button>


        </div>


    </div>

</div>


<script src="/js/script.js?v=20261024"></script>

</body>

</html>
